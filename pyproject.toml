[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "orlovanskyinoy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-groq>=1.1.3",
    "langchainhub>=0.1.21",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.3",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "tavily-python>=0.8.4",
    "trafilatura>=2.2.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
